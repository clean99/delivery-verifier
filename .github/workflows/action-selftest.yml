name: Action self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==8.4.2
      - name: Create committed regression fixture
        id: fixture
        shell: bash
        run: |
          temporary=$(mktemp -d "$RUNNER_TEMP/dv-fixture.XXXXXX")
          repo="$temporary/repo with spaces"
          mkdir -p "$repo/tests"
          git -C "$repo" init -b main
          printf '__pycache__/\n.pytest_cache/\n' > "$repo/.gitignore"
          printf 'def split_words(text):\n    return text.split(" ")\n' > "$repo/words.py"
          git -C "$repo" add .
          git -C "$repo" -c user.name=Fixture -c user.email=fixture@example.invalid \
            -c commit.gpgsign=false commit -m 'Initial behavior'
          git -C "$repo" switch -c fix
          printf 'def split_words(text):\n    return text.split()\n' > "$repo/words.py"
          cat > "$repo/tests/test_words.py" <<'PY'
          from words import split_words

          def test_repeated_spaces():
              assert split_words("red   green") == ["red", "green"]
          PY
          cat > "$repo/tests/test_hollow.py" <<'PY'
          from words import split_words

          def test_single_space():
              assert split_words("red green") == ["red", "green"]
          PY
          git -C "$repo" add .
          git -C "$repo" -c user.name=Fixture -c user.email=fixture@example.invalid \
            -c commit.gpgsign=false commit -m 'Split repeated spaces'
          git clone --bare "$repo" "$temporary/origin.git"
          git -C "$repo" remote add origin "$temporary/origin.git"
          printf 'repo=%s\ntemporary=%s\n' "$repo" "$temporary" >> "$GITHUB_OUTPUT"
      - name: Accept a regression that detects the fix
        id: regression
        uses: ./
        with:
          version: local
          base: main
          timeout: '60'
          working-directory: ${{ steps.fixture.outputs.repo }}
          test: python -m pytest --tb=long tests/test_words.py
      - name: Reject a test that passes without the fix
        id: hollow
        continue-on-error: true
        uses: ./
        with:
          version: local
          base: main
          timeout: '60'
          working-directory: ${{ steps.fixture.outputs.repo }}
          test: python -m pytest --tb=long tests/test_hollow.py
      - name: Assert action outcomes and retained evidence
        if: ${{ always() }}
        shell: bash
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          REGRESSION_OK: ${{ steps.regression.outputs.ok }}
          REGRESSION_VERDICT: ${{ steps.regression.outputs.verdict }}
          REGRESSION_EVIDENCE: ${{ steps.regression.outputs.evidence-path }}
          HOLLOW_OUTCOME: ${{ steps.hollow.outcome }}
          HOLLOW_OK: ${{ steps.hollow.outputs.ok }}
          HOLLOW_VERDICT: ${{ steps.hollow.outputs.verdict }}
          HOLLOW_EVIDENCE: ${{ steps.hollow.outputs.evidence-path }}
        run: |
          test "$REGRESSION_OUTCOME" = success
          test "$REGRESSION_OK" = true
          test "$REGRESSION_VERDICT" = PASS
          test "$HOLLOW_OUTCOME" = failure
          test "$HOLLOW_OK" = false
          test "$HOLLOW_VERDICT" = FAIL
          test "$REGRESSION_EVIDENCE" != "$HOLLOW_EVIDENCE"
          for evidence in "$REGRESSION_EVIDENCE" "$HOLLOW_EVIDENCE"; do
            test -s "$evidence/proof.json"
            test -s "$evidence/red.log"
            test -s "$evidence/green.log"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          proof = json.loads((Path(os.environ["HOLLOW_EVIDENCE"]) / "proof.json").read_text())
          assert proof["ok"] is False, proof
          assert proof["state"] == "complete", proof
          assert proof["red"]["exit_code"] == 0, proof
          assert proof["green"]["exit_code"] == 0, proof
          PY
      - name: Remove the fixture
        if: ${{ always() && steps.fixture.outputs.temporary != '' }}
        shell: bash
        env:
          FIXTURE_TEMP: ${{ steps.fixture.outputs.temporary }}
        run: rm -rf -- "$FIXTURE_TEMP"
