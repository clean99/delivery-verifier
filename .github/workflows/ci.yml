name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
      LEFTHOOK: "0"
      UV_NO_CACHE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install package and test tooling
        run: python -m pip install . ruff==0.17.1 pytest==8.4.2 setuptools==80.9.0 pipx==1.7.1
      - name: Check installed entry point
        run: dv --version
      - name: Lint
        run: ruff check .
      - name: Test
        run: DV_SPEC_INSTALL=1 python -m unittest discover -s tests -v
      - name: Run offline demo
        run: python examples/demo/run.py
