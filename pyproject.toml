[build-system]
requires = ["setuptools>=68"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "delivery-verifier"
version = "0.1.0"
description = "Local verification gates for agent-made code changes"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dv = "dv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dv = ["_vendor/NOTICE", "_vendor/tomllib/LICENSE"]

[tool.setuptools.data-files]
"share/delivery-verifier" = ["README.md", "README.zh-CN.md", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "MANIFEST.in", "build_backend.py"]
"share/delivery-verifier/docs" = ["docs/design.md"]
"share/delivery-verifier/docs/design" = ["docs/design/first-usable-version.md"]
"share/delivery-verifier/docs/handbook" = ["docs/handbook/green-tests.md", "docs/handbook/cases.json"]
"share/delivery-verifier/examples/handbook" = ["examples/handbook/run.py"]
"share/delivery-verifier/examples/handbook/fixtures" = ["examples/handbook/fixtures/*.py"]
"share/delivery-verifier/docs/assets" = ["docs/assets/demo.gif"]
"share/delivery-verifier/examples/demo" = ["examples/demo/run.py"]
"share/delivery-verifier/tests" = ["tests/*.py"]
"share/delivery-verifier/tests/fixtures/runners" = ["tests/fixtures/runners/*.log", "tests/fixtures/runners/*.json"]
"share/delivery-verifier/src/dv" = ["src/dv/*.py"]
"share/delivery-verifier/src/dv/_vendor" = ["src/dv/_vendor/__init__.py", "src/dv/_vendor/NOTICE"]
"share/delivery-verifier/src/dv/_vendor/tomllib" = ["src/dv/_vendor/tomllib/*.py", "src/dv/_vendor/tomllib/LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/dv/_vendor", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
